[project]
name = "dino-survival-scripts"
version = "0.1.0"
description = "Python gameplay/AI logic nhung vao DinoSurvival.exe qua pybind11"
requires-python = ">=3.11,<3.12"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts", "tools", "tests/python"]
extend-exclude = ["build", "build-*", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = [".", "typings"]
addopts = "-q --import-mode=importlib"

[tool.mypy]
python_version = "3.11"
mypy_path = "typings"
packages = ["scripts"]
strict = true
